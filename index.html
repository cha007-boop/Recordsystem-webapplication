<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="countainer py-5">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                                <h1 class="card-title mb-0">{{intro}}</h1>
                            </div>
                            <!-- Add records inputs -->

                            <!-- filtering inputs -->

                            <!-- Table of records -->
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>ID</th>
                                            <th>Title</th>
                                            <th>Artist</th>
                                            <th>Duration</th>
                                            <th>Publication year</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="record in list" :key="record.id">
                                            <th>{{record.id}}</th>
                                            <td>{{record.title}}</td>
                                            <td>{{record.artist}}</td>
                                            <td>{{record.duration}}</td>
                                            <td>{{record.publicationYear}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>


    <!-- Bootstrap modal for delete -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h2 class="modal-title fs-5" id="deleteModalLabel">Confirm deletion</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"
                        @click="deleteTarget = null"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">
                        Are you sure you want to delete <strong>{{ deleteTarget?.name }}</strong>?
                        This action cannot be undone.
                    </p>
                    <p v-if="deleteError" class="alert alert-danger mt-3 mb-0" role="alert">
                        {{ deleteError }}
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" @click="deleteTarget = null"
                        :disabled="deletingId !== null">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-danger" @click="deleteItem"
                        :disabled="!deleteTarget || deletingId !== null">
                        {{ deletingId !== null ? 'Deleting...' : 'Delete stock' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
